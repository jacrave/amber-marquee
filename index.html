<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marquee Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating Toggle Button -->
    <button id="menuToggleBtn" class="menu-fab-btn" aria-label="Toggle Controls">⚙️</button>

    <!-- Slide-in Drawer Controls -->
    <aside id="controls" class="controls-panel">
        <div class="panel-header">
            <span>Settings</span>
            <button id="closeControlsBtn" class="close-btn">&times;</button>
        </div>

        <div class="control-group">
            <label for="textInput">Message</label>
            <input type="text" id="textInput" value="Amber is a CHUD">
        </div>

        <div class="control-group">
            <label for="speedInput">Speed: <span id="speedVal">10</span>s</label>
            <input type="range" id="speedInput" min="2" max="25" value="10">
        </div>

        <div class="control-row">
            <div class="control-group">
                <label for="bgColor">BG</label>
                <input type="color" id="bgColor" value="#ffc0cb">
            </div>

            <div class="control-group">
                <label for="textColor">Text</label>
                <input type="color" id="textColor" value="#c71585">
            </div>
        </div>

        <button id="fullscreenBtn" class="action-btn">Fullscreen</button>
    </aside>

    <!-- Marquee Viewport -->
    <main class="marquee-viewport">
        <div id="marqueeText" class="scrolling-text">Amber is a CHUD</div>
    </main>

    <script src="app.js"></script>
</body>
</html>
