<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Marquee Web App</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <!-- Main Scrolling Text Area -->
    <main class="marquee-viewport">
        <div id="marqueeText" class="scrolling-text">Amber is a CHUD</div>
    </main>

    <!-- Bottom Controls -->
    <div id="controlWrapper">
        <button id="toggleBtn" class="pill-btn">⚙️ Settings</button>

        <div id="settingsCard" class="card hidden">
            <div class="row">
                <input type="text" id="textInput" value="Amber is a CHUD" placeholder="Enter text...">
            </div>

            <div class="row items-split">
                <div class="field">
                    <label>Speed: <span id="speedVal">10</span>s</label>
                    <input type="range" id="speedInput" min="2" max="25" value="10">
                </div>
                <div class="field picker-field">
                    <label>BG</label>
                    <input type="color" id="bgColor" value="#ffc0cb">
                </div>
                <div class="field picker-field">
                    <label>Text</label>
                    <input type="color" id="textColor" value="#c71585">
                </div>
            </div>

            <div class="row">
                <button id="fullscreenBtn" class="action-btn">Fullscreen</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=3"></script>
</body>
</html>
